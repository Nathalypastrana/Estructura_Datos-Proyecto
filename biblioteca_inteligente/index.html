<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca inteligente</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">BI</span>
      <div><h1>Biblioteca inteligente</h1><p>Estructuras de datos aplicadas a una biblioteca</p></div>
    </div>
    <nav id="tabs" role="tablist">
      <button role="tab" data-tab="catalogo" class="on">Catálogo</button>
      <button role="tab" data-tab="estanteria">Estantería</button>
      <button role="tab" data-tab="prestamos">Préstamos</button>
      <button role="tab" data-tab="busquedas">Búsquedas</button>
      <button role="tab" data-tab="arboles">Árboles</button>
      <button role="tab" data-tab="analisis">Vectores y recursión</button>
    </nav>
  </header>

  <main id="vista"></main>
  <div id="aviso" role="status" aria-live="polite"></div>
</body>
</html>
